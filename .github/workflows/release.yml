name: release

# 推 v* 标签即发布：每个目标平台各自构建二进制、刷新摘要、打成 SForum 包并挂到 Release。
# 仓库根是「外部扩展源根」，扩展包位于 plugins/sforum.qq-bot。
# 也可用 workflow_dispatch 手动跑（只做校验与构建，不创建 Release）。
#
# 骨架阶段（M0）：后端与清单尚未落地，verify 阶段会失败并说明缺什么——
# 发版本来就要求有可打包的东西，这里不刻意放宽。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sforum_ref:
        description: 构建所使用的 SForum 引用（tag / 分支 / commit）
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SFORUM_REPOSITORY: keeptrue/SForum
  SFORUM_REF: ${{ github.event.inputs.sforum_ref || 'main' }}
  PACKAGE_DIR: plugins/sforum.qq-bot
  PACKAGE_SLUG: sforum.qq-bot

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.SFORUM_REPOSITORY }}
          ref: ${{ env.SFORUM_REF }}
          path: sforum

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: sforum/apps/api/go.mod
          cache: false

      - name: Require backend, manifest and frontend
        run: |
          set -euo pipefail
          if [ ! -f "plugin/$PACKAGE_DIR/backend/go.mod" ]; then
            echo "::error title=后端尚未落地::$PACKAGE_DIR/backend/go.mod 不存在，无法发版。"
            exit 1
          fi
          if [ ! -f "plugin/$PACKAGE_DIR/sforum.extension.json" ]; then
            echo "::error title=清单尚未落地::$PACKAGE_DIR/sforum.extension.json 不存在，无法发版。"
            exit 1
          fi
          if [ ! -f "plugin/$PACKAGE_DIR/frontend/admin/package.json" ]; then
            echo "::error title=前端尚未落地::$PACKAGE_DIR/frontend/admin/package.json 不存在，发布包会缺设置页组件。"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build frontend and verify committed artifacts
        working-directory: plugin/${{ env.PACKAGE_DIR }}/frontend/admin
        # 发布包里带的是提交入库的 dist；重建后对不上就说明包内容与源码脱节，直接拦在发版前。
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build
          cd "$GITHUB_WORKSPACE/plugin"
          if ! git diff --exit-code -- "$PACKAGE_DIR/frontend/admin/dist"; then
            echo "::error title=前端产物与提交内容不一致::重新构建后的 dist 与仓库里的不同。把 ${PACKAGE_DIR}/frontend/admin/dist 的变更一并提交再打标签。"
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard -- "$PACKAGE_DIR/frontend/admin/dist")"
          if [ -n "$untracked" ]; then
            echo "::error title=前端产物未提交::以下产物没有入库："
            echo "$untracked"
            exit 1
          fi

      - name: Purge frontend node_modules before digest
        # 作者树摘要（DigestAuthorTree）跳过 node_modules，exact-artifact 校验（VerifiedTreeDigest）
        # 不跳过；不删依赖树，digest --write 写进去的摘要与随后 validate/test 算出来的必然不同。
        run: |
          set -euo pipefail
          dep="plugin/$PACKAGE_DIR/frontend/admin/node_modules"
          if [ -d "$dep" ]; then
            rm -rf "$dep"
            echo "已剔除 $dep"
          else
            echo "无需剔除：$dep 不存在"
          fi

      - name: Check plugin go directive covers the host requirement
        run: |
          set -euo pipefail
          host_go="$(awk '$1 == "go" { print $2; exit }' sforum/apps/api/go.mod)"
          pkg_go="$(awk '$1 == "go" { print $2; exit }' "plugin/${PACKAGE_DIR}/backend/go.mod")"
          echo "host go=${host_go} plugin go=${pkg_go}"
          newest="$(printf '%s\n%s\n' "${host_go}" "${pkg_go}" | sort -V | tail -n 1)"
          if [ "${newest}" != "${pkg_go}" ]; then
            echo "::error title=go 指令落后于宿主::宿主 apps/api 要求 go >= ${host_go}，插件 go.mod 仍是 ${pkg_go}。把 ${PACKAGE_DIR}/backend/go.mod 的 go 指令提到 ${host_go}。"
            exit 1
          fi

      - name: Point SDK replace at the checked-out framework
        working-directory: plugin/${{ env.PACKAGE_DIR }}/backend
        run: go mod edit -replace github.com/keeptrue/sforum/apps/api="$GITHUB_WORKSPACE/sforum/apps/api"

      - name: Backend vet and unit tests
        working-directory: plugin/${{ env.PACKAGE_DIR }}/backend
        run: |
          go vet ./...
          go test ./...

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(python3 -c "import json;print(json.load(open('plugin/$PACKAGE_DIR/sforum.extension.json'))['version'])")"
          echo "tag=$TAG_VERSION manifest=$MANIFEST_VERSION"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error title=版本不一致::标签 v$TAG_VERSION 与 sforum.extension.json 的 version ($MANIFEST_VERSION) 不一致。"
            exit 1
          fi

      - name: Build host binary and run host contract checks
        run: |
          set -euo pipefail
          (cd "plugin/$PACKAGE_DIR/backend" && CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$GITHUB_WORKSPACE/plugin/$PACKAGE_DIR/backend/plugin" ./)
          cd sforum/apps/api
          go run ./cmd/sforum extension digest --write "$GITHUB_WORKSPACE/plugin/$PACKAGE_DIR"
          go run ./cmd/sforum extension validate "$GITHUB_WORKSPACE/plugin/$PACKAGE_DIR"
          go run ./cmd/sforum extension brand check "$GITHUB_WORKSPACE/plugin/$PACKAGE_DIR"
          go run ./cmd/sforum extension test "$GITHUB_WORKSPACE/plugin/$PACKAGE_DIR"

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.SFORUM_REPOSITORY }}
          ref: ${{ env.SFORUM_REF }}
          path: sforum

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: sforum/apps/api/go.mod
          cache: false

      - name: Point SDK replace at the checked-out framework
        working-directory: plugin/${{ env.PACKAGE_DIR }}/backend
        run: go mod edit -replace github.com/keeptrue/sforum/apps/api="$GITHUB_WORKSPACE/sforum/apps/api"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build frontend (must match the committed dist)
        working-directory: plugin/${{ env.PACKAGE_DIR }}/frontend/admin
        # 打包前重建一次，确保 zip 里的 dist 就是这份源码产出的；对不上就中止，别发一个漂移的包。
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build
          cd "$GITHUB_WORKSPACE/plugin"
          if ! git diff --exit-code -- "$PACKAGE_DIR/frontend/admin/dist"; then
            echo "::error title=前端产物与提交内容不一致::重建后的 dist 与仓库里的不同，拒绝打包。"
            exit 1
          fi

      - name: Purge frontend node_modules before packaging
        # rsync 已把 node_modules 排除在 stage 之外，这里再物理删一次：stage 之外的摘要/校验
        # 也不该看到依赖树，免得哪天有人去掉那条 exclude 就静默发一个摘要对不上的包。
        run: |
          set -euo pipefail
          dep="plugin/$PACKAGE_DIR/frontend/admin/node_modules"
          if [ -d "$dep" ]; then
            rm -rf "$dep"
            echo "已剔除 $dep"
          else
            echo "无需剔除：$dep 不存在"
          fi

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }} package
        id: package
        run: |
          set -euo pipefail
          STAGE="$GITHUB_WORKSPACE/stage"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          # 只复制运行时需要的文件：Go 源码、go.mod/sum、旧的构建产物、前端依赖树都不进发布包。
          rsync -a \
            --exclude '/backend/*.go' --exclude '/backend/go.mod' --exclude '/backend/go.sum' \
            --exclude '/backend/plugin' --exclude '/backend/plugin.exe' \
            --exclude '/frontend/admin/node_modules' \
            "plugin/$PACKAGE_DIR/" "$STAGE/"

          # 编译参数与 prepare-package.sh / ci.yml 同参：CGO_ENABLED + GOOS/GOARCH + -trimpath +
          # -buildvcs=false，不带 -ldflags。摘要不跨环境相同——宿主 dev 带 -ldflags=-s -w，且这里与
          # ci.yml 都把 replace 重写为绝对路径，属预期而非 bug，见 NOTES.md §11。
          (cd "plugin/$PACKAGE_DIR/backend" && \
            CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -buildvcs=false -o "$STAGE/backend/plugin" ./)

          VERSION="$(python3 -c "import json;print(json.load(open('plugin/$PACKAGE_DIR/sforum.extension.json'))['version'])")"
          ASSET="${PACKAGE_SLUG}_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd sforum/apps/api
          # 每个平台的二进制不同，摘要必须按该平台重新写入后再打包。
          go run ./cmd/sforum extension digest --write "$STAGE"
          go run ./cmd/sforum extension validate "$STAGE"
          go run ./cmd/sforum extension brand check "$STAGE"
          go run ./cmd/sforum extension package "$STAGE" --exclude-source -o "$GITHUB_WORKSPACE/dist/$ASSET.zip"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.asset }}
          path: |
            dist/*.zip
            dist/*.zip.sbom.json
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all package artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Compute checksums
        working-directory: dist
        run: sha256sum *.zip | tee SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PRERELEASE_FLAG=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_FLAG=(--prerelease)
          fi
          # 发布说明的「变更」段落取自 CHANGELOG.md 里与标签版本对应的小节；没有该文件就只写安装步骤。
          python3 - "$VERSION" <<'PY'
          import os
          import re
          import sys

          version = sys.argv[1]
          excerpt = ''
          if os.path.exists('CHANGELOG.md'):
              text = open('CHANGELOG.md', encoding='utf-8').read()
              match = re.search(rf'^## \[{re.escape(version)}\].*?(?=^## \[|\Z)', text, re.S | re.M)
              if match:
                  excerpt = match.group(0).strip() + '\n'
              else:
                  print(f'::warning title=缺少变更小节::CHANGELOG.md 里没有 {version} 的小节，发布说明只写安装步骤。')
          open('changelog.md', 'w', encoding='utf-8').write(excerpt)
          PY

          {
            if [ -s changelog.md ]; then
              cat changelog.md
              echo
            fi
            echo '## 安装'
            echo
            echo '1. 下载与服务器平台匹配的压缩包（`linux_amd64` / `linux_arm64` / `darwin_arm64` / `darwin_amd64`）。'
            echo '2. 装到 SForum：后台「插件管理 → 安装插件」上传 zip；或解压到某个外部源根的 `plugins/sforum.qq-bot/`（即本仓库的目录布局）。'
            echo '3. 后台启用 **SForum QQ Bot**，按宿主提示完成一次 exact-artifact 信任确认。'
            echo '4. 在插件设置页填 QQ 开放平台的 AppID / AppSecret，保存后启用「启用机器人」。'
            echo
            echo '每个压缩包内的清单摘要与其中可执行文件一一对应，跨平台包不可混用；校验：`sha256sum -c SHA256SUMS`。'
            echo
            echo '## 兼容性'
            echo
            echo '使用宿主 Protocol V2（`sforum.host@2`）与 Manifest V3。'
            echo '若启用失败，请对照 README 的「配置」与「目录说明」两节。'
          } > notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md "${PRERELEASE_FLAG[@]}"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md "${PRERELEASE_FLAG[@]}" dist/*
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
